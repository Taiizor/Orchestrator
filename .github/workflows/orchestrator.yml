name: 🤖 Orchestrator Engine

on:
  schedule:
    # Heartbeat check every 15 minutes to monitor subagents and advance roadmap
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute (tick, plan, review, project, setup, chatops)'
        required: false
        default: 'tick'
        type: choice
        options:
          - tick
          - plan
          - review
          - project
          - setup
          - chatops
          - services
  repository_dispatch:
    types: [subagent-completed, wake-orchestrator]

jobs:
  orchestrate:
    concurrency:
      group: orchestrator-singleton
      cancel-in-progress: false
    name: Run Orchestration Cycle
    # Triggered by schedule, manual dispatch, or subagent wake events only.
    # Slash comments are handled by chatops.yml (fast lane) and can request
    # a cycle explicitly via /tick.
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: ${{ vars.GH_CLIENT_ID || vars.CLIENT_ID || secrets.GH_CLIENT_ID || secrets.CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY || secrets.APP_PRIVATE_KEY }}
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write
      discussions: write
      # NOTE: GitHub Projects v2 needs a PAT with read/write:project scope
      # (GH_PROJECT_TOKEN secret); GITHUB_TOKEN cannot access Projects v2.

    steps:
      - name: 🔑 Generate GitHub App Token (optional)
        id: app-token
        if: ${{ env.CLIENT_ID != '' && env.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: 🥟 Setup Bun Runtime
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: ⚡ Cache Bun Modules & OpenCode Binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/bin/opencode
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: ⚙️ Install OpenCode CLI
        run: |
          if ! command -v opencode &> /dev/null; then
            echo "Installing OpenCode CLI..."
            bun install -g --trust @opencode/cli
          fi
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          mkdir -p "$HOME/.config/opencode"
          printf '{\n  "permission": {\n    "*": "allow"\n  }\n}\n' > "$HOME/.config/opencode/opencode.json"
          opencode --version || echo "OpenCode installed"

      - name: 📦 Install Project Dependencies
        run: bun install

      - name: 🌿 Ensure State and Integration Branches Exist
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ensure develop / integration branch exists (single-repo only;
          # in dual-repo mode content branches live in the data repo)
          if [ -z "${DATA_REPO}" ]; then
          if ! git rev-parse --verify origin/develop >/dev/null 2>&1; then
            echo "Creating integration branch 'develop'..."
            git checkout -b develop
            git push origin develop
            git checkout main
          fi
          fi

      - name: 🐳 Docker Hub Login (optional, raises pull limits)
        env:
          DOCKERHUB_POOL: ${{ secrets.DOCKERHUB_POOL }}
        run: |
          # Credential pool: DOCKERHUB_POOL = JSON array
          # [{"username":"u1","token":"t1"},...]. The account is picked by
          # run ID modulo pool size, spreading pulls evenly with no state.
          if [ -n "$DOCKERHUB_POOL" ]; then
            N=$(echo "$DOCKERHUB_POOL" | jq 'length' 2>/dev/null || echo 0)
            if [ "$N" -gt 0 ] 2>/dev/null; then
              I=$(( GITHUB_RUN_ID % N )) || true
              U=$(echo "$DOCKERHUB_POOL" | jq -r ".[$I].username // empty")
              T=$(echo "$DOCKERHUB_POOL" | jq -r ".[$I].token // empty")
              if [ -n "$U" ] && [ -n "$T" ]; then
                LOGGED=0
                for TRY in 1 2 3; do
                  if echo "$T" | docker login -u "$U" --password-stdin; then LOGGED=1; break; fi
                  echo "Pool login attempt $TRY/3 failed (auth endpoint?) — retrying in 10s..."
                  sleep 10
                done
                if [ "$LOGGED" -eq 1 ]; then
                  echo "Logged in as pool account #$((I + 1))/$N."
                  exit 0
                fi
                echo "Pool login failed after 3 attempts; falling back."
              else
                echo "DOCKERHUB_POOL entry #$((I + 1)) is missing username/token — trying legacy pair."
              fi
            else
              echo "DOCKERHUB_POOL unparsable (not a JSON array) — trying legacy pair."
            fi
          fi
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          else
            echo "No Docker Hub credentials — anonymous pulls (rate-limited)."
          fi

      - name: 🐳 Start Project Services (if declared)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_PROJECT_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN }}
          INTEGRATION_BRANCH: develop
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_PAT: ${{ steps.app-token.outputs.token || secrets.DATA_PAT }}
          DOCKERHUB_POOL: ${{ secrets.DOCKERHUB_POOL }}
        run: |
          ACTION="${{ github.event.inputs.action || 'tick' }}"
          bun run orchestrator/engine.ts --action=services
          FILE="workspace/docker-compose.services.yml"
          if [ ! -f "$FILE" ]; then
            echo "No project services declared — skipping."
            exit 0
          fi
          # Only actions that can execute tests need live services (tick:
          # conflict-resolution verification; services: explicit request).
          # plan/review/project/setup never run code — skip pulls entirely.
          case "$ACTION" in
            tick|services) ;;
            *) echo "Skipping service startup for action=$ACTION (no tests run)."; exit 0;;
          esac
          echo "Starting ephemeral CI services from $FILE..."
          # Pool rotation helper (re-login as another account on rate limit).
          # DOCKERHUB_POOL is exposed to this step via env below.
          pool_login() {
            U=$(echo "$DOCKERHUB_POOL" | jq -r ".[$1].username // empty")
            T=$(echo "$DOCKERHUB_POOL" | jq -r ".[$1].token // empty")
            [ -n "$U" ] && [ -n "$T" ] && echo "$T" | docker login -u "$U" --password-stdin
          }
          POOL_SIZE=$(echo "${DOCKERHUB_POOL:-}" | jq 'length' 2>/dev/null || echo 0)
          [ "$POOL_SIZE" -gt 0 ] 2>/dev/null || POOL_SIZE=0
          START_IDX=0
          if [ "$POOL_SIZE" -gt 0 ] 2>/dev/null; then START_IDX=$(( GITHUB_RUN_ID % POOL_SIZE )) || true; fi
          ATTEMPT=0
          ROTATED=0
          while true; do
            OUT=$(docker compose -f "$FILE" up -d --wait --wait-timeout 120 2>&1) && CODE=0 || CODE=$?
            echo "$OUT" | tail -n 4
            if [ "$CODE" -eq 0 ]; then break; fi
            # Rate-limited account? Rotate to an untried pool account first.
            if echo "$OUT" | grep -qi 'toomanyrequests\|rate limit'; then
              if [ "$POOL_SIZE" -gt 1 ] && [ "$ROTATED" -lt $(( POOL_SIZE - 1 )) ]; then
                NEXT=$(( (START_IDX + 1 + ROTATED) % POOL_SIZE )) || true
                ROTATED=$(( ROTATED + 1 )) || true
                if pool_login "$NEXT"; then
                  echo "Rate limited — rotated to pool account #$(( NEXT + 1 ))/$POOL_SIZE."
                  continue
                fi
              fi
            fi
            # Transient blips get plain retries (a failing rotation falls here too).
            ATTEMPT=$(( ATTEMPT + 1 )) || true
            if [ "$ATTEMPT" -ge 5 ]; then
              echo "Services failed to start after 5 attempts."
              exit 1
            fi
            echo "Compose up failed (attempt $ATTEMPT/5) — retrying in 30s..."
            sleep 30
          done
          if [ -f "workspace/.services.env" ]; then
            cat "workspace/.services.env" >> "$GITHUB_ENV"
            echo "Service env exported."
          fi

      - name: 🚀 Run Orchestrator Engine
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_PROJECT_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
          OPENCODE_VARIANT: ${{ secrets.OPENCODE_VARIANT }}
          MAX_CONCURRENT_SUBAGENTS: 5
          INTEGRATION_BRANCH: develop
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_PAT: ${{ steps.app-token.outputs.token || secrets.DATA_PAT }}
          PUBLIC_FEATURES: ${{ vars.PUBLIC_FEATURES }}
          DATA_FEATURES: ${{ vars.DATA_FEATURES }}
          GH_CLIENT_ID: ${{ vars.GH_CLIENT_ID || vars.CLIENT_ID || secrets.GH_CLIENT_ID || secrets.CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY || secrets.APP_PRIVATE_KEY }}
        run: |
          ACTION="${{ github.event.inputs.action || 'tick' }}"
          bun run orchestrator/engine.ts --action=$ACTION

