name: 🛠️ Subagent Worker
run-name: "Subagent: ${{ inputs.taskId }} (${{ inputs.role }})"

on:
  workflow_dispatch:
    inputs:
      taskId:
        description: 'Task Identifier (e.g. TASK-001)'
        required: true
        type: string
      role:
        description: 'Assigned Role (architect, backend, frontend, mobile, qa, security, tracker, reviewer, fullstack, launch)'
        required: true
        type: string
      branch:
        description: 'Target task branch (e.g. task/TASK-001-setup-db)'
        required: true
        type: string
      stack:
        description: 'Product stack override (bun | go | rust | dotnet | python | php). Empty = inherit task.stack ?? roadmap.stack (runner resolves). All toolchains are provisioned regardless.'
        required: false
        default: ''
        type: string

concurrency:
  # Isolated per task ID: independent tasks execute concurrently without blocking each other
  group: subagent-${{ inputs.taskId }}
  cancel-in-progress: false

jobs:
  execute-task:
    name: "Subagent: ${{ inputs.taskId }} (${{ inputs.role }})"
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: ${{ vars.GH_CLIENT_ID || vars.CLIENT_ID || secrets.GH_CLIENT_ID || secrets.CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY || secrets.APP_PRIVATE_KEY }}
      # Keep the models fetch ENABLED. The CLI resolves models from a snapshot
      # baked into its build, so any model released after that build stays
      # invisible ("Model unavailable") on a cold runner until the registry
      # is refreshed. One models.dev GET per job is far cheaper than losing
      # the primary model on every run.
      OPENCODE_DISABLE_MODELS_FETCH: "false"
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
    # Job cap 75 > model-call budget 60: the extra 15 min are headroom for
    # fallback models, push/wake/log steps so the killer never lands mid-work.
    timeout-minutes: 75
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write
      discussions: write

    steps:
      - name: 🔑 Generate GitHub App Token (optional)
        id: app-token
        if: ${{ env.CLIENT_ID != '' && env.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: 🥟 Setup Bun Runtime (engine + JS/TS products)
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: 🐹 Setup Go toolchain (Go products)
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: 🦀 Setup Rust toolchain (Rust products)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 🟣 Setup .NET SDK (.NET products)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: 🐍 Setup Python + pytest (Python products)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # NOTE: no `cache: pip` — it hard-fails on repos without
          # requirements.txt/pyproject.toml (e.g. fresh template checkouts).
          # Python tasks needing cache restore it inside their own run.

      - name: 🐘 Setup PHP + Composer (PHP products)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: pcov
          tools: composer

      - name: ⚡ Cache Bun Modules & OpenCode Binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.bun/bin/opencode
            ~/.cache/opencode
          # Lockfile + CLI pin in the key: a bun.lock-only change or an
          # @opencode/cli bump must invalidate, or warm runners restore
          # stale modules / skip the new binary forever. The -svc suffix
          # marks the entry that also carries the OpenCode service binary
          # (~213MB, re-downloaded by every job otherwise); cache entries
          # are immutable, so adding a path needs a new key.
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('package.json', 'bun.lock') }}-opencode-2.0.32-svc
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: ⚙️ Install OpenCode CLI
        run: |
          if ! command -v opencode &> /dev/null; then
            echo "Installing OpenCode CLI..."
            bun install -g --trust @opencode/cli@2.0.32
          fi
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          mkdir -p "$HOME/.config/opencode"
          printf '{\n  "permission": {\n    "*": "allow"\n  }\n}\n' > "$HOME/.config/opencode/opencode.json"
          opencode --version || echo "OpenCode installed"

      - name: 📦 Install Project Dependencies
        # Frozen lockfile (see orchestrator.yml): never rewrite bun.lock on CI.
        run: bun install --frozen-lockfile

      - name: 🌐 Cache Playwright browsers (real UI interaction proof)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🌐 Install Chromium for browser-driven journey tests
        # UI tasks prove user journeys (not just component render). Without a
        # browser, e2e degrades to HTTP-only and interaction bugs (dead auth
        # gates, unwired buttons) slip through green. Cached after first run.
        run: bunx playwright install --only-shell chromium || echo "browser install skipped (HTTP-only e2e)"

      - name: 📦 Restore ECC vendor content (cached, keyed by manifest)
        uses: actions/cache@v6
        with:
          path: vendor/ecc
          key: ecc-vendor-${{ hashFiles('vendor/ecc/.manifest.json') }}

      - name: 🧩 Ensure ECC vendor (release download on cache miss)
        # --all: full agent-facing surface (see orchestrator.yml).
        run: bun run scripts/install-ecc.ts --all

      - name: 🧩 Stage ECC skills (toolchain-style, on-demand depth)
        run: bun run scripts/stage-ecc-skills.ts

      - name: 🧹 Restore generated ECC manifest (keep tree clean for branch ops)
        # install-ecc.ts rewrites vendor/ecc/.manifest.json (tracked pin file);
        # a dirty tree aborts every later branch checkout/merge. The staged
        # skills are already copied — restoring the pin loses nothing.
        run: git checkout -- vendor/ecc/.manifest.json 2>/dev/null || true

      - name: 🐳 Docker Hub Login (optional, raises pull limits)
        env:
          DOCKERHUB_POOL: ${{ secrets.DOCKERHUB_POOL }}
        run: |
          # Credential pool: DOCKERHUB_POOL = JSON array
          # [{"username":"u1","token":"t1"},...]. The account is picked by
          # run ID modulo pool size, spreading pulls evenly with no state.
          if [ -n "$DOCKERHUB_POOL" ]; then
            N=$(echo "$DOCKERHUB_POOL" | jq 'length' 2>/dev/null || echo 0)
            if [ "$N" -gt 0 ] 2>/dev/null; then
              I=$(( GITHUB_RUN_ID % N )) || true
              U=$(echo "$DOCKERHUB_POOL" | jq -r ".[$I].username // empty")
              T=$(echo "$DOCKERHUB_POOL" | jq -r ".[$I].token // empty")
              if [ -n "$U" ] && [ -n "$T" ]; then
                LOGGED=0
                for TRY in 1 2 3; do
                  if echo "$T" | docker login -u "$U" --password-stdin; then LOGGED=1; break; fi
                  echo "Pool login attempt $TRY/3 failed (auth endpoint?) — retrying in 10s..."
                  sleep 10
                done
                if [ "$LOGGED" -eq 1 ]; then
                  echo "Logged in as pool account #$((I + 1))/$N."
                  exit 0
                fi
                echo "Pool login failed after 3 attempts; falling back."
              else
                echo "DOCKERHUB_POOL entry #$((I + 1)) is missing username/token — trying legacy pair."
              fi
            else
              echo "DOCKERHUB_POOL unparsable (not a JSON array) — trying legacy pair."
            fi
          fi
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          else
            echo "No Docker Hub credentials — anonymous pulls (rate-limited)."
          fi

      - name: 🐳 Start Project Services (if declared)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_PROJECT_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN }}
          INTEGRATION_BRANCH: develop
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_PAT: ${{ steps.app-token.outputs.token || secrets.DATA_PAT }}
          DOCKERHUB_POOL: ${{ secrets.DOCKERHUB_POOL }}
        run: |
          bun run orchestrator/engine.ts --action=services
          FILE="workspace/docker-compose.services.yml"
          if [ ! -f "$FILE" ]; then
            echo "No project services declared — skipping."
            exit 0
          fi
          echo "Starting ephemeral CI services from $FILE..."
          # Pool rotation helper (re-login as another account on rate limit).
          pool_login() {
            U=$(echo "$DOCKERHUB_POOL" | jq -r ".[$1].username // empty")
            T=$(echo "$DOCKERHUB_POOL" | jq -r ".[$1].token // empty")
            [ -n "$U" ] && [ -n "$T" ] && echo "$T" | docker login -u "$U" --password-stdin
          }
          POOL_SIZE=$(echo "${DOCKERHUB_POOL:-}" | jq 'length' 2>/dev/null || echo 0)
          [ "$POOL_SIZE" -gt 0 ] 2>/dev/null || POOL_SIZE=0
          START_IDX=0
          if [ "$POOL_SIZE" -gt 0 ] 2>/dev/null; then START_IDX=$(( GITHUB_RUN_ID % POOL_SIZE )) || true; fi
          ATTEMPT=0
          ROTATED=0
          while true; do
            OUT=$(docker compose -f "$FILE" up -d --wait --wait-timeout 120 2>&1) && CODE=0 || CODE=$?
            echo "$OUT" | tail -n 4
            if [ "$CODE" -eq 0 ]; then break; fi
            # Rate-limited account? Rotate to an untried pool account first.
            if echo "$OUT" | grep -qi 'toomanyrequests\|rate limit'; then
              if [ "$POOL_SIZE" -gt 1 ] && [ "$ROTATED" -lt $(( POOL_SIZE - 1 )) ]; then
                NEXT=$(( (START_IDX + 1 + ROTATED) % POOL_SIZE )) || true
                ROTATED=$(( ROTATED + 1 )) || true
                if pool_login "$NEXT"; then
                  echo "Rate limited — rotated to pool account #$(( NEXT + 1 ))/$POOL_SIZE."
                  continue
                fi
              fi
            fi
            # Transient blips get plain retries (a failing rotation falls here too).
            ATTEMPT=$(( ATTEMPT + 1 )) || true
            if [ "$ATTEMPT" -ge 5 ]; then
              echo "Services failed to start after 5 attempts."
              exit 1
            fi
            echo "Compose up failed (attempt $ATTEMPT/5) — retrying in 30s..."
            sleep 30
          done
          if [ -f "workspace/.services.env" ]; then
            cat "workspace/.services.env" >> "$GITHUB_ENV"
            echo "Service env exported."
          fi

      - name: 🖥️ Start OpenCode background server (optional)
        run: |
          # Persistent server: CLI calls attach to it instead of booting one
          # per model attempt (project scan + model discovery each time).
          # Best-effort — per-call servers remain the fallback.
          timeout 90 opencode service start 2>&1 | tail -n 3 || echo "service start unavailable; continuing with per-call servers."

      - name: 🤖 Execute Subagent Task
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_PROJECT_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
          OPENCODE_VARIANT: ${{ secrets.OPENCODE_VARIANT }}
          INTEGRATION_BRANCH: develop
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_PAT: ${{ steps.app-token.outputs.token || secrets.DATA_PAT }}
          PUBLIC_FEATURES: ${{ vars.PUBLIC_FEATURES }}
          DATA_FEATURES: ${{ vars.DATA_FEATURES }}
          GH_CLIENT_ID: ${{ vars.GH_CLIENT_ID || vars.CLIENT_ID || secrets.GH_CLIENT_ID || secrets.CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY || secrets.APP_PRIVATE_KEY }}
        run: |
          # --stack only when explicitly pinned: an empty input inherits
          # task.stack ?? roadmap.stack inside the runner. A default 'bun'
          # here would silently override every non-bun layer (wrong skill,
          # wrong test gate).
          EXTRA=""
          if [ -n "${{ inputs.stack }}" ]; then EXTRA="--stack=${{ inputs.stack }}"; fi
          bun run subagents/runner.ts \
            --taskId="${{ inputs.taskId }}" \
            --role="${{ inputs.role }}" \
            --branch="${{ inputs.branch }}" \
            $EXTRA

      - name: 📤 Collect OpenCode Logs (on failure)
        if: failure()
        run: |
          mkdir -p .opencode-logs
          cp -r "$HOME/.local/share/opencode/log" .opencode-logs/ 2>/dev/null || echo "no opencode logs found"

      - name: 📤 Attach OpenCode Logs Artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-logs-${{ inputs.taskId }}-${{ github.run_id }}
          path: .opencode-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🔑 Mint fresh App Token for wake (optional)
        id: wake-token
        # App installation tokens live ~60 min but this job can run 75: on
        # long runs the job-start token is already expired when the wake
        # fires and the dispatch died silently with 401 (lost tick). Mint a
        # fresh token right before waking; the wake's chain below still
        # falls back to the job-start token / GITHUB_TOKEN.
        if: ${{ always() && env.CLIENT_ID != '' && env.APP_PRIVATE_KEY != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: 🔔 Wake Up Orchestrator
        if: always()
        env:
          GH_TOKEN: ${{ steps.wake-token.outputs.token || steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for an already-queued orchestrator run before dispatching..."
          PENDING=$(gh run list --workflow orchestrator.yml --limit 10 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested")] | length' 2>/dev/null || echo 0)
          if [ "$PENDING" -gt 0 ]; then
            echo "Orchestrator already queued/running ($PENDING) — skipping duplicate wake."
          else
            echo "Triggering Orchestrator to inspect task status..."
            gh workflow run orchestrator.yml || echo "::warning::Wake dispatch failed (non-fatal) — check the token env above."
          fi
